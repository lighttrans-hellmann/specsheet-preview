<!doctype html>
<html lang="en" data-md-color-scheme="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wavefront Phase Modifier [Surface, Profile-Defined] - VirtualLab Fusion Documentation</title>

  <!-- Material-like base styling + exact LightTrans repository overrides -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="./stylesheets/extra.css">

  <style>
    :root { --pico-font-size: 100%; }
    body { margin: 0; background: var(--md-default-bg-color, #fff); color: var(--md-default-fg-color, #212121); }
    .md-header { position: sticky; top: 0; z-index: 10; background: #AF0917; color: #fff; }
    .md-header__inner { max-width: 1220px; margin: 0 auto; padding: .65rem 1rem; display:flex; align-items:center; gap:.8rem; }
    .md-header__title { font-weight: 700; }
    .md-tabs { background:#7F0712; color:#fff; overflow-x:auto; white-space:nowrap; }
    .md-tabs__inner { max-width:1220px; margin:0 auto; padding:.4rem 1rem; }
    .md-tabs a { color:#fff; text-decoration:none; margin-right:1.1rem; font-size:.78rem; }
    .md-main__inner { max-width: 1220px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .md-content { max-width: 1000px; margin: 0 auto; }
    .md-content__inner > h1 { margin-top: 0; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:.55rem .7rem; border:1px solid #e0e0e0; vertical-align:top; }
    code { white-space:normal; }
    .loading { opacity:.65; }
    footer { margin-top:2rem; padding:1.25rem 1rem; background:#f5f5f5; text-align:center; font-size:.75rem; }
    @media (max-width: 768px) {
      .md-header__inner { padding:.55rem .7rem; }
      .md-tabs__inner { padding:.35rem .7rem; }
      .md-main__inner { padding:1rem .7rem 2rem; }
    }
  </style>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(','\\)']], displayMath: [['$$','$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="md-header">
    <div class="md-header__inner">
      <div class="md-header__title">VirtualLab Fusion Documentation</div>
    </div>
  </header>
  <nav class="md-tabs">
    <div class="md-tabs__inner">
      <a href="#">Home</a>
      <a href="#">Release Notes</a>
      <a href="#">Tutorials</a>
      <a href="#">Use Cases</a>
      <a href="#">Specification Sheets</a>
      <a href="#">Whitepapers</a>
      <a href="#">System Requirements</a>
    </div>
  </nav>

  <main class="md-main">
    <div class="md-main__inner">
      <article class="md-content">
        <div id="content" class="md-content__inner loading">Loading repository version…</div>
      </article>
    </div>
  </main>

  <footer>Copyright © 2026 LightTrans International GmbH</footer>

  <script>
    async function render() {
      const el = document.getElementById('content');
      const r = await fetch('./source/SpecSheet_Wavefront_Phase_Modifier_Surface_Profile_Defined.md?ts=' + Date.now());
      const md = await r.text();
      marked.setOptions({ gfm: true, breaks: false });
      el.innerHTML = marked.parse(md);
      el.classList.remove('loading');

      // Keep the repository's relative links useful in this standalone mirror.
      for (const a of el.querySelectorAll('a')) {
        const href = a.getAttribute('href') || '';
        if (href.includes('CF-WPMS01.pdf')) {
          a.href = 'https://www.lighttrans.com/docs/assets/pdfs/CF-WPMS01.pdf';
        } else if (href.includes('Overview_List_SpecSheets')) {
          a.href = 'https://www.lighttrans.com/docs/spec-sheets/Overview_List_SpecSheets/';
        }
      }
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]);
    }
    window.addEventListener('DOMContentLoaded', render);
  </script>
  <script defer src="./javascripts/extra.js"></script>
</body>
</html>
